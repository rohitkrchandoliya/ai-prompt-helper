<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Prompt Helper</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f6f8;
      color: #222;
    }

    textarea, select, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      box-sizing: border-box;
      font-size: 16px;
    }

    textarea { min-height: 120px; }

    button {
      background: #1769e0;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover { background: #0e50b5; }

    #result, .history-prompt {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: white;
      padding: 15px;
      border-radius: 6px;
    }

    .history-prompt {
      border: 1px solid #ddd;
      cursor: pointer;
      margin: 8px 0;
    }

    .history-prompt:hover { background: #edf4ff; }

    #clearHistory { background: #b42318; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>AI Prompt Helper</h1>
  <p>Turn a simple idea into a clearer AI prompt.</p>

  <label for="idea">Your idea</label>
  <textarea id="idea" placeholder="Example: Explain climate change"></textarea>
  <p class="muted">Tip: Press Ctrl + Enter (or Cmd + Enter on Mac) to improve your prompt.</p>

  <label for="purpose">Choose a purpose</label>
  <select id="purpose">
    <option value="general">General</option>
    <option value="learning">Learning</option>
    <option value="coding">Coding</option>
    <option value="writing">Writing</option>
    <option value="research">Research</option>
    <option value="business">Business</option>
    <option value="creative">Creative writing</option>
    <option value="resume">Resume and career</option>
  </select>

  <button id="improve">Improve my prompt</button>

  <h2>Improved prompt</h2>
  <div id="result" role="status" aria-live="polite" aria-atomic="true">Your improved prompt will appear here.</div>
  <button id="copy">Copy prompt</button>

  <hr>
  <h2>Prompt History</h2>
  <p class="muted">Your 10 most recent prompts are saved in this browser.</p>
  <div id="historyList"></div>
  <button id="clearHistory">Clear History</button>

  <script src="script.js"></script>
  <script>
    const ideaInput = document.getElementById("idea");
    const purposeInput = document.getElementById("purpose");
    const result = document.getElementById("result");
    const historyList = document.getElementById("historyList");

    function renderHistory() {
      const history = getPromptHistory();
      historyList.replaceChildren();

      if (history.length === 0) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "muted";
        emptyMessage.textContent = "No saved prompts yet.";
        historyList.appendChild(emptyMessage);
        return;
      }

      history.forEach((item) => {
        const prompt = typeof item === "string" ? item : item.prompt;
        if (typeof prompt !== "string") return;

        const button = document.createElement("button");
        button.className = "history-prompt";
        button.textContent = prompt;
        button.addEventListener("click", () => {
          result.textContent = prompt;
        });
        historyList.appendChild(button);
      });
    }

    function generatePrompt() {
      const prompt = improvePrompt(
        ideaInput.value,
        purposeInput.value
      );

      result.textContent = prompt;

      if (ideaInput.value.trim()) {
        savePromptToHistory(prompt);
        renderHistory();
      }
    }

    document.getElementById("improve").addEventListener("click", generatePrompt);

    ideaInput.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        event.preventDefault();
        generatePrompt();
      }
    });

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch {
          // Try the compatibility fallback below.
        }
      }

      const temporaryInput = document.createElement("textarea");
      temporaryInput.value = text;
      temporaryInput.setAttribute("readonly", "");
      temporaryInput.style.position = "fixed";
      temporaryInput.style.opacity = "0";
      document.body.appendChild(temporaryInput);
      temporaryInput.select();

      let copied = false;
      try {
        copied = document.execCommand("copy");
      } catch {
        copied = false;
      } finally {
        temporaryInput.remove();
      }

      return copied;
    }

    document.getElementById("copy").addEventListener("click", async () => {
      const text = result.textContent;
      const copied = await copyText(text);

      if (copied) {
        alert("Prompt copied!");
      } else {
        alert("Copy was blocked. Select the prompt and copy it manually.");
      }
    });

    document.getElementById("clearHistory").addEventListener("click", () => {
      clearPromptHistory();
      renderHistory();
    });

    renderHistory();
  </script>
</body>
</html>
