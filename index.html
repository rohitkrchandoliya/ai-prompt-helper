
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Prompt Helper</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f6f8;
      color: #222;
    }
    textarea, select, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      box-sizing: border-box;
      font-size: 16px;
    }
    textarea { min-height: 120px; }
    button {
      background: #1769e0;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    #result {
      white-space: pre-wrap;
      background: white;
      padding: 15px;
      border-radius: 6px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>AI Prompt Helper</h1>
  <p>Turn a simple idea into a clearer AI prompt.</p>

  <label for="idea">Your idea</label>
  <textarea id="idea" placeholder="Example: Explain climate change"></textarea>

  <label for="purpose">Choose a purpose</label>
  <select id="purpose">
    <option value="general">General</option>
    <option value="learning">Learning</option>
    <option value="coding">Coding</option>
    <option value="writing">Writing</option>
  </select>

  <button id="improve">Improve my prompt</button>
  <h2>Improved prompt</h2>
  <div id="result">Your improved prompt will appear here.</div>
  <button id="copy">Copy prompt</button>

  <script src="script.js"></script>
  <script>
    document.getElementById("improve").addEventListener("click", () => {
      const idea = document.getElementById("idea").value;
      const purpose = document.getElementById("purpose").value;
      document.getElementById("result").textContent =
        improvePrompt(idea, purpose);
    });

    document.getElementById("copy").addEventListener("click", async () => {
      const text = document.getElementById("result").textContent;
      try {
        await navigator.clipboard.writeText(text);
        alert("Prompt copied!");
      } catch {
        alert("Copy failed. Please copy the text manually.");
      }
    });
  </script>
</body>
</html>
